version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: medbot_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: healthcare_chatbot
    networks:
      - medbot_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medbot_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/healthcare_chatbot
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - medbot_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medbot_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medbot_network

volumes:
  mongodb_data:

networks:
  medbot_network:
    driver: bridge
